[filament_switch_sensor toolhead_sensor]
pause_on_runout: True
#runout_gcode:
#insert_gcode:
#event_delay:
#pause_delay:

[filament_switch_sensor runout_sensor]
pause_on_runout: True
#runout_gcode:
#insert_gcode:
#event_delay:
#pause_delay:

[settling_probe]
settling_sample: True